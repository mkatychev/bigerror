[workspace]
members = ["bigerror", "bigerror_derive"]
resolver = "2"

[workspace.package]
edition = "2024"
description = "handle big errors ¯\\_(ツ)_/¯"
license = "MIT"
documentation = "https://docs.rs/bigerror"
repository = "https://github.com/mkatychev/bigerror"

[workspace.dependencies]
derive_more = { version = "2", features = ["display", "deref"], default-features = false }
tracing = "0.1"
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = "2.0.117"
bigerror-derive = { path = "./bigerror_derive", version = "0.1.0" }
rootcause = "0.13.0"
rootcause-backtrace = { version = "0.13.0" }
rootcause-tracing = { version = "0.13.0" }

[workspace.lints.clippy]
create_dir = "warn"
equatable_if_let = "warn"
error_impl_error = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
filetype_is_file = "warn"
flat_map_option = "warn"
fn_params_excessive_bools = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
iter_not_returning_iterator = "warn"
large_futures = "warn"
large_include_file = "warn"
large_stack_frames = "warn"
large_types_passed_by_value = "warn"
needless_collect = "warn"
needless_continue = "warn"
needless_for_each = "warn"
needless_pass_by_ref_mut = "warn"
needless_pass_by_value = "warn"
non_send_fields_in_send_ty = "warn"
nonstandard_macro_braces = "warn"
redundant_else = "warn"
redundant_type_annotations = "warn"
str_to_string = "warn"
todo = "warn"
too_many_lines = "warn"
trivial_regex = "warn"
trivially_copy_pass_by_ref = "warn"
try_err = "warn"
uninlined_format_args = "deny"
unnecessary_mut_passed = "deny"
unnested_or_patterns = "warn"
unused_async = "warn"
useless_let_if_seq = "warn"

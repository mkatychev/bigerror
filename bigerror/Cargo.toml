[package]
name = "bigerror"
version = "0.14.0"
edition.workspace = true
description.workspace = true
license.workspace = true
documentation.workspace = true
repository.workspace = true

[features]
default = ["std", "backtrace"]
std = ["tracing?/std"]
backtrace = ["std", "dep:rootcause-backtrace"]
tracing = ["dep:tracing"]
spantrace = ["std", "tracing", "dep:rootcause-tracing"]

anyhow = ["rootcause/compat-anyhow1"]
eyre = ["rootcause/compat-eyre06"]

[dependencies]
rootcause = { workspace = true }
rootcause-backtrace = { workspace = true, optional = true }
rootcause-tracing = { workspace = true, optional = true }
tracing = { workspace = true, optional = true, features = ["attributes"] }
bigerror-derive.workspace = true
derive_more.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
